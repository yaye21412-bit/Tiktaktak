workflows:
  default-workflow:
    name: Compilación Completa Titaktak
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generar estructura completa de Android
        script: flutter create . --platforms=android
      - name: Inyectar permisos críticos y configuración de red
        script: |
          # Agregar permisos de red y estado al Manifiesto
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          # Asegurar que el nombre de la aplicación sea correcto
          sed -i 's/android:label=".*"/android:label="Titaktak"/' android/app/src/main/AndroidManifest.xml
      - name: Limpiar y obtener dependencias
        script: |
          flutter clean
          flutter pub get
      - name: Construir APK optimizado (Bundle)
        script: flutter build apk --release --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - name: Construir APK de Android
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

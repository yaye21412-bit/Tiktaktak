workflows:
  default-workflow:
    name: Compilar APK Titaktak
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Crear soporte para Android
        script: flutter create . --platforms=android
      - name: Limpiar proyecto
        script: flutter clean
      - name: Instalar dependencias de Flutter
        script: flutter packages get
      - name: Construir APK de Android
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
